networks:
    local:
        driver: bridge
    proxy:
        driver: bridge
services:
    bind9:
        networks:
            local: {}
        ports:
            - 53:53/tcp
            - 53:53/udp
    pihole:
        networks:
            local: {}
            proxy: {}
        ports:
            - 5353:53/tcp
            - 5353:53/udp
    nginx:
        networks:
            proxy: {}

