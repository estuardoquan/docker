volumes:
    crt:
        external: true
        name: step_crt_jwt
    bind9_cache:
        driver: local
    bind9_lib:
        driver: local
    bind9_src:
        driver: local
    pihole:
        driver: local
services:
    bind9:
        extends:
            file: $TEMPLATE_DNS_BIND9
            service: bind9 
        volumes:
            - bind9_src:/etc/bind
            - bind9_cache:/var/cache/bind
            - bind9_lib:/var/lib/bind
        restart: unless-stopped
    pihole:
        extends:
            file: $TEMPLATE_DNS_PIHOLE
            service: pihole
        volumes:
            - pihole:/etc/pihole
        depends_on:
            - bind9
        restart: unless-stopped
    nginx:
        extends:
            file: $TEMPLATE_NGINX_SERVER
            service: server
        volumes:
            - crt:$NGINX_SERVER_WATCH_CRT:ro
            - ./servers.yaml:$NGINX_SERVER_YAML
        depends_on:
            - pihole
        restart: unless-stopped

