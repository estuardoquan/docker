networks:
    ipvlan15:
        external: true
        name: ipvlan15
    ipvlan16:
        external: true
        name: ipvlan16
volumes:
    crt:
        external: true
        name: step_crt_jwt
    bind9_cache:
        driver: local
        driver_opts:
            type: nfs
            o: "addr=$NAS_ADDRESS,rw,nolock,soft,nfsvers=4"
            device: $NAS_DNS_BIND9_CACHE
    bind9_lib:
        driver: local
        driver_opts:
            type: nfs
            o: "addr=$NAS_ADDRESS,rw,nolock,soft,nfsvers=4"
            device: $NAS_DNS_BIND9_LIB
    bind9_src:
        driver: local
        driver_opts:
            type: nfs
            o: "addr=$NAS_ADDRESS,rw,nolock,soft,nfsvers=4"
            device: $NAS_DNS_BIND9_SRC
    pihole:
        driver: local
        driver_opts:
            type: nfs
            o: "addr=$NAS_ADDRESS,rw,nolock,soft,nfsvers=4"
            device: $NAS_DNS_PIHOLE
services:
    bind9:
        extends:
            file: $TEMPLATE_DNS_BIND9
            service: bind9 
        volumes:
            - bind9_src:/etc/bind
            - bind9_cache:/var/cache/bind
            - bind9_lib:/var/lib/bind
        networks:
            ipvlan15:
                ipv4_address: $DNS_BIND9_IPVLAN15_ADDRESS
            ipvlan16:
                ipv4_address: $DNS_BIND9_IPVLAN16_ADDRESS
        restart: unless-stopped
    pihole:
        extends:
            file: $TEMPLATE_DNS_PIHOLE
            service: pihole
        volumes:
            - pihole:/etc/pihole
        networks:
            ipvlan16:
                ipv4_address: $DNS_PIHOLE_IPVLAN16_ADDRESS
        depends_on:
            - bind9
        restart: unless-stopped
    nginx:
        extends:
            file: $TEMPLATE_NGINX_SERVER
            service: server
        volumes:
            - crt:$NGINX_SERVER_WATCH_CRT:ro
            - ./servers.yaml:$NGINX_SERVER_YAML
        networks:
            ipvlan16:
                ipv4_address: $NGINX_SERVER_IPVLAN16_ADDRESS
        depends_on:
            - pihole
        restart: unless-stopped

