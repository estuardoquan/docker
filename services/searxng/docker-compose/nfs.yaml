volumes:
    config:
        driver_opts:
            type: nfs
            o: "addr=$NFS_ADDRESS,rw,nolock,soft,nfsvers=4"
            device: "$NFS_SEARXNG_CONFIG"
    data:
        driver_opts:
            type: nfs
            o: "addr=$NFS_ADDRESS,rw,nolock,soft,nfsvers=4"
            device: "$NFS_SEARXNG_DATA"
    valkey:
        driver_opts:
            type: nfs
            o: "addr=$NFS_ADDRESS,rw,nolock,soft,nfsvers=4"
            device: "$NFS_SEARXNG_VALKEY"

