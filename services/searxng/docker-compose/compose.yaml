volumes:
    crt:
        external: true
        name: step_crt_jwt
    config:
        driver: local
    data:
        driver: local
    valkey:
        driver: local
services:
    core:
        extends:
            file: $TEMPLATE_SEARXNG_CORE
            service: core
        volumes:
            - config:/etc/searxng:Z
            - data:/var/cache/searxng
        restart: unless-stopped
    valkey:
        extends:
            file: $TEMPLATE_DB_VALKEY
            service: valkey
        volumes:
            - valkey:/data
        depends_on:
            - core
        command: valkey-server --save 30 1 --loglevel warning
        restart: unless-stopped
    nginx:
        extends:
            file: $TEMPLATE_NGINX_SERVER
            service: server
        volumes:
            - crt:$NGINX_SERVER_WATCH_CRT:ro
            - ./servers.yaml:$NGINX_SERVER_YAML
        depends_on:
            - core 
        restart: unless-stopped
