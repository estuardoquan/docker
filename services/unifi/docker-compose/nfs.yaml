volumes:
    config:
        driver_opts:
            type: nfs
            o: "addr=$NFS_ADDRESS,rw,nolock,soft,nfsvers=4"
            device: "$NFS_UNIFI_CONFIG"
    db:
        driver_opts:
            type: nfs
            o: "addr=$NFS_ADDRESS,rw,nolock,soft,nfsvers=4"
            device: "$NFS_UNIFI_DB"

