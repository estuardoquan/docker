volumes:
    crt:
        external: true
        name: step_crt_jwt
    config:
        driver: local
    db:
        driver: local
services:
    db:
        extends:
            file: $TEMPLATE_UNIFI_MONGO
            service: mongo
        volumes:
            - db:/data/db
            - ./init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh:ro
        user: $UNIFI_MONGO_PUID_PGID
        restart: unless-stopped
    console:
        extends:
            file: $TEMPLATE_UNIFI_CONSOLE
            service: console
        volumes:
            - config:/config
        depends_on:
            - db 
        restart: unless-stopped
    nginx:
        extends:
            file: $TEMPLATE_NGINX_SERVER
            service: server
        volumes:
            - crt:$NGINX_SERVER_WATCH_CRT:ro
            - ./servers.yaml:$NGINX_SERVER_YAML
        depends_on:
            - console
        restart: unless-stopped

