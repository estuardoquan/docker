networks:
    local:
        driver: bridge
    10_vlan:
        external: true
        name: 10_vlan
volumes:
    ca:
        driver: local
        driver_opts:
            type: nfs
            o: "addr=$NAS_ADDRESS,rw,nolock,soft,nfsvers=4"
            device: "$NAS_STEP_CA"
    crt_jwt:
        driver: local
        driver_opts:
            type: nfs
            o: "addr=$NAS_ADDRESS,rw,nolock,soft,nfsvers=4"
            device: "$NAS_STEP_CRTJWT"
secrets:
    provisioner_password:
        file: $STEP_PROVISIONER_PASSWORD_FILE
services:
    ca:
        extends:
            file: $TEMPLATE_STEP_CA
            service: ca
        volumes:
            - ca:$STEP_CA_STEPPATH
        networks:
            local: {}
            10_vlan:
                ipv4_address: $STEP_CA_10VLAN_ADDRESS
        restart: unless-stopped
    crt:
        extends:
            file: $TEMPLATE_STEP_CRT
            service: crt
        volumes:
            - crt_jwt:/var/local/step
        networks:
            - local
        depends_on:
            - ca
        restart: unless-stopped

